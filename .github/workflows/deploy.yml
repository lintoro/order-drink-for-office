name: 部署至 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 設定 GITHUB_TOKEN 的權限以允許部署至 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允許同時只有一個並行部署，跳過執行中的舊構建
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安裝依賴套件
        run: npm ci

      - name: 執行單元測試
        run: npm test

      - name: 構建生產靜態檔案
        run: npm run build

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 Pages 構建產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
